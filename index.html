<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>동행벤처스</title><meta name="description" content="사업 진단·성장 전략부터 정부지원사업, 투자 유치, 공공 제안, 창업교육까지. 직접 창업해 본 팀이 기업의 다음 단계를 설계하고 끝까지 실행합니다."><meta property="og:title" content="동행벤처스 | Startup Growth Consulting"><meta property="og:description" content="전략부터 실행까지, 성장을 함께 설계합니다."><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@500&amp;family=Noto+Sans+KR:wght@300;400;500;600;700;800&amp;display=swap">
<style id="css">/* Layout: Apple-style product page for a consulting firm. White canvas, 1200px column, oversized headlines ending in a period,
   rounded product cards in a horizontal rail, dark "stage" bands for the hero render and case study. One accent: cobalt. Single deliberate light look with dark bands. */
:root{
  --paper:#FFFFFF; --mist:#F4F5F8; --mist-2:#EBEDF2; --line:#E2E5EB;
  --text:#121418; --muted:#6B7180; --faint:#A3A8B4;
  --ink:#0C0E12; --ink-2:#16191F; --ink-3:#22262E; --ink-line:rgba(255,255,255,.1);
  --on-ink:#F3F5F9; --on-ink-m:#98A0B2;
  --cobalt:#2F4BFF; --cobalt-d:#1E37D9; --cobalt-soft:#ECEFFF; --sky:#9DAAFF; --seal:#E5483B;
  --t-blue:#E9EDFF; --t-sand:#F3EEE6; --t-mint:#E5F3EE; --t-lilac:#EFEAFB;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Inter Tight","Noto Sans KR","Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans KR",ui-monospace,monospace;
  --r-xl:30px; --r-lg:22px; --r-md:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f-ko);font-size:17px;line-height:1.65;letter-spacing:-.018em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,255,255,.86)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,dl,dd,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px;border-radius:6px}
[data-k]{white-space:pre-line}
.wrap{max-width:1248px;margin-inline:auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(80px,10vw,140px)}
.band.mist{background:var(--mist)}
.band.ink{background:var(--ink);color:var(--on-ink)}
.en{font-family:var(--f-en)}
.eyebrow{font-family:var(--f-en);font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--cobalt)}
.ink .eyebrow{color:var(--sky)}
.h2{font-size:clamp(34px,5vw,64px);line-height:1.12;font-weight:800;letter-spacing:-.05em;text-wrap:balance}
.eyebrow + .h2{margin-top:10px}
.lead{font-size:clamp(17px,1.5vw,21px);line-height:1.6;color:var(--muted);max-width:36em;font-weight:500}
.ink .lead{color:var(--on-ink-m)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 48px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,56px)}
.sec-head > div{min-width:0}
.tlink{display:inline-flex;align-items:center;gap:4px;color:var(--cobalt);font-weight:600;font-size:16px;white-space:nowrap}
.tlink svg{width:14px;height:14px;transition:transform .2s}
.tlink:hover svg{transform:translateX(3px)}
.ink .tlink{color:var(--sky)}
.num{white-space:nowrap;font-family:var(--f-en);font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1}
.unit{font-family:var(--f-ko);font-weight:700;letter-spacing:-.02em;margin-left:3px;font-size:.42em}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px;transition:background .2s,transform .2s;white-space:nowrap}
.pill.primary{background:var(--cobalt);color:#fff}
.pill.primary:hover{background:var(--cobalt-d)}
.pill.sm{height:38px;padding:0 18px;font-size:15px}
.pill svg{width:16px;height:16px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:60px;gap:20px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo svg{width:30px;height:30px;flex:none}
.logo .w{display:flex;flex-direction:column;gap:3px;line-height:1}
.logo .ko{font-weight:800;font-size:16px;letter-spacing:-.04em}
.logo .enw{font-family:var(--f-en);font-size:8.5px;font-weight:600;letter-spacing:.16em;color:var(--muted)}
.nav-links{display:flex;align-items:center;gap:30px;font-size:14.5px;font-weight:500;color:#3A3F4A}
.nav-links a:not(.pill):hover{color:var(--text)}
.burger{display:none;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.burger span{display:block;width:18px;height:1.8px;background:var(--text);border-radius:2px;transition:transform .25s,opacity .2s}
.nav.open .burger span:nth-child(1){transform:translateY(6.8px) rotate(45deg)}
.nav.open .burger span:nth-child(2){opacity:0}
.nav.open .burger span:nth-child(3){transform:translateY(-6.8px) rotate(-45deg)}

/* hero */
.hero{padding-top:clamp(56px,8vw,104px);text-align:center}
.hero .eyebrow{display:inline-flex;gap:10px;align-items:center}
.hero .eyebrow .since{color:var(--faint);font-weight:500}
.hero h1{margin-top:18px;font-size:clamp(44px,7.4vw,104px);line-height:1.04;font-weight:800;letter-spacing:-.06em;text-wrap:balance}
.hero h1 .t1{display:block;font-weight:300;color:#4A505C}
.hero h1 .t2{display:block;background:linear-gradient(92deg,var(--text) 30%,var(--cobalt) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
body.editing .hero h1 .t2{color:var(--text);background:none}
.hero .lead{margin:26px auto 0;max-width:44em;text-wrap:balance}
.hero .cta{display:flex;gap:12px 22px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:34px}

/* stage (CSS-rendered documents) */
.stage{margin-top:clamp(48px,6vw,72px);position:relative;border-radius:var(--r-xl);background:radial-gradient(120% 90% at 50% 110%,#1D2C8F 0%,#10142A 42%,var(--ink) 75%);overflow:hidden;height:clamp(380px,48vw,620px);--p:0}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 100%,rgba(47,75,255,.35),transparent 70%);pointer-events:none}
.paper{position:absolute;left:50%;bottom:-6%;transform-origin:50% 100%;border-radius:14px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);text-align:left;transition:transform .1s linear;z-index:1}
.paper .kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;font-weight:500}
.pl{width:min(40%,420px);aspect-ratio:1/1.3;background:#FBFBFD;color:var(--text);padding:clamp(18px,3%,34px);z-index:3;transform:translateX(-50%) translateY(calc(var(--p) * -24px))}
.pl .kind{color:var(--cobalt)}
.pl h3{font-size:clamp(15px,1.9vw,25px);font-weight:800;letter-spacing:-.04em;margin-top:8px;line-height:1.25}
.pl .toc{margin-top:clamp(12px,2vw,22px);display:grid;gap:clamp(8px,1.2vw,14px);font-size:clamp(11px,1.15vw,15px);font-weight:600}
.pl .toc li{display:grid;gap:7px}
.pl .toc li::after{content:"";height:5px;border-radius:3px;background:linear-gradient(90deg,var(--mist-2) 0 78%,transparent 78%)}
.pl .toc li:nth-child(2)::after{background:linear-gradient(90deg,var(--mist-2) 0 64%,transparent 64%)}
.pl .toc li:nth-child(3)::after{background:linear-gradient(90deg,var(--cobalt-soft) 0 88%,transparent 88%)}
.pl .toc.edit{display:block;white-space:pre-line}
.dk{width:min(36%,400px);aspect-ratio:16/10;background:var(--ink-2);color:var(--on-ink);padding:clamp(14px,2.2%,26px);z-index:2;bottom:22%;transform:translateX(calc(-50% - 84% - var(--p) * 70px)) rotate(calc(-7deg - var(--p) * 3deg))}
.dk .kind{color:var(--sky)}
.dk h4,.ct h4{font-family:var(--f-en);font-size:clamp(14px,1.8vw,24px);font-weight:700;letter-spacing:-.03em;margin-top:6px}
.dk p,.ct p{font-size:clamp(10px,1vw,13px);color:var(--on-ink-m);margin-top:2px}
.dk .bars{position:absolute;right:clamp(14px,2.2%,26px);bottom:clamp(14px,2.2%,26px);display:flex;align-items:flex-end;gap:6px;height:44%}
.dk .bars i{width:clamp(8px,1.1vw,14px);border-radius:3px 3px 1px 1px;background:var(--ink-3)}
.dk .bars i:last-child{background:var(--cobalt)}
.ct{width:min(30%,330px);aspect-ratio:1/1.35;background:#F6F4EF;color:var(--text);padding:clamp(14px,2.4%,28px);z-index:2;bottom:12%;transform:translateX(calc(-50% + 94% + var(--p) * 70px)) rotate(calc(6deg + var(--p) * 3deg))}
.ct .kind{color:#8A7F6C}
.ct p{color:var(--muted)}
.ct .ln{margin-top:clamp(10px,1.6vw,18px);display:grid;gap:8px}
.ct .ln i{display:block;height:5px;border-radius:3px;background:#E6E1D7}
.ct .ln i:nth-child(2){width:84%}.ct .ln i:nth-child(4){width:62%}
.seal{position:absolute;right:12%;bottom:12%;width:clamp(48px,6vw,78px);aspect-ratio:1;border-radius:50%;border:2.5px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-weight:800;font-size:clamp(12px,1.5vw,19px);transform:rotate(-14deg);letter-spacing:.06em}

/* statement */
.statement p{font-size:clamp(28px,3.9vw,52px);line-height:1.32;font-weight:700;letter-spacing:-.045em;max-width:22em;text-wrap:pretty}
.statement .w{color:#ABB0BA;transition:color .35s}
.statement .w.on{color:var(--text)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{position:relative;padding:30px 22px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stat + .stat{border-left:1px solid var(--line)}
.stat .num{font-size:clamp(34px,3.6vw,50px)}
.stat .lbl{font-size:14px;color:var(--muted);font-weight:500}

/* lineup rail */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(280px,31%,380px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:max(24px,calc((100vw - 1200px)/2));padding-left:max(24px,calc((100vw - 1200px)/2));padding-right:max(24px,calc((100vw - 1200px)/2));padding-bottom:8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.prod{scroll-snap-align:start;position:relative;border-radius:var(--r-xl);background:var(--paper);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.prod .art{height:220px;position:relative;display:grid;place-items:center;overflow:hidden}
.prod .art .tile{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:0 18px 40px -16px rgba(20,30,80,.35);position:relative;z-index:1}
.prod .art .tile svg{width:44px;height:44px;color:var(--cobalt)}
.prod .art::before,.prod .art::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(47,75,255,.14)}
.prod .art::before{width:220px;height:220px}
.prod .art::after{width:340px;height:340px}
.prod.t-blue .art{background:var(--t-blue)}
.prod.t-ink .art{background:var(--ink-2)}
.prod.t-ink .art::before,.prod.t-ink .art::after{border-color:rgba(157,170,255,.16)}
.prod.t-ink .art .tile{background:var(--ink-3);box-shadow:0 18px 40px -16px rgba(0,0,0,.7)}
.prod.t-ink .art .tile svg{color:var(--sky)}
.prod.t-sand .art{background:var(--t-sand)}
.prod.t-sand .art .tile svg{color:#8A6A3B}
.prod.t-sand .art::before,.prod.t-sand .art::after{border-color:rgba(138,106,59,.16)}
.prod.t-mint .art{background:var(--t-mint)}
.prod.t-mint .art .tile svg{color:#1F7A5A}
.prod.t-mint .art::before,.prod.t-mint .art::after{border-color:rgba(31,122,90,.15)}
.prod.t-lilac .art{background:var(--t-lilac)}
.prod.t-lilac .art .tile svg{color:#6A43C9}
.prod.t-lilac .art::before,.prod.t-lilac .art::after{border-color:rgba(106,67,201,.15)}
.prod .body{padding:26px 28px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;flex:1}
.prod .badge{font-size:12.5px;font-weight:700;color:#C2410C;min-height:19px}
.prod .tagen{font-family:var(--f-en);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.prod h3{font-size:26px;font-weight:800;letter-spacing:-.05em;line-height:1.25}
.prod .desc{font-size:15.5px;color:#3E4350;line-height:1.6;margin-top:6px}
.prod .meta{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:10px;padding:5px 12px;background:var(--mist);border-radius:999px}
.prod .acts{margin-top:auto;padding-top:22px;display:flex;gap:18px;align-items:center}
.rail-ctl{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.rail-ctl button{width:40px;height:40px;border-radius:50%;background:var(--mist-2);display:grid;place-items:center;color:#3A3F4A;transition:background .2s}
.rail-ctl button:hover{background:#DDE0E7}
.rail-ctl svg{width:18px;height:18px}

/* program */
.prog-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px}
.box{position:relative;border-radius:var(--r-xl);background:var(--mist);padding:clamp(26px,3.4vw,44px);min-width:0}
.box-lbl{font-family:var(--f-en);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;display:block;margin-bottom:20px}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.track{position:relative;background:var(--paper);border-radius:var(--r-lg);padding:22px 22px 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.track .no{font-family:var(--f-mono);font-size:12px;color:var(--cobalt);font-weight:500}
.track b{font-size:19px;font-weight:800;letter-spacing:-.04em}
.track span:last-of-type{font-size:14.5px;color:var(--muted);line-height:1.55}
.sched{display:grid}
.slot{position:relative;display:grid;grid-template-columns:62px 54px minmax(0,1fr);gap:10px;align-items:baseline;padding:15px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:0}
.slot .d{font-family:var(--f-mono);font-size:12px;color:var(--cobalt);font-weight:500}
.slot .t{font-family:var(--f-en);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.slot .v{font-weight:600;font-size:16px;letter-spacing:-.03em}
.box .note{font-size:13.5px;color:var(--muted);margin-top:18px}
.prog-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 64px;align-items:end;margin-bottom:clamp(36px,5vw,56px)}

/* why */
.why-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.why{position:relative;background:var(--paper);border-radius:var(--r-xl);padding:30px 28px 34px;display:flex;flex-direction:column;gap:12px;min-width:0}
.why .k{font-size:14px;font-weight:700;color:var(--muted)}
.why h3{font-size:clamp(22px,2vw,27px);font-weight:800;letter-spacing:-.05em;line-height:1.3}
.why p{font-size:15.5px;color:#454A56;line-height:1.65}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s;border-top:2px solid var(--text)}
.step{position:relative;padding:28px 26px 8px 0;display:flex;flex-direction:column;gap:10px;min-width:0}
.step + .step{padding-left:26px;border-left:1px solid var(--line)}
.step .n{font-family:var(--f-mono);font-size:13px;color:var(--cobalt);font-weight:500}
.step .sen{font-family:var(--f-en);font-size:13px;color:var(--muted);font-weight:600}
.step h3{font-size:30px;font-weight:800;letter-spacing:-.05em;line-height:1.2}
.step p{font-size:15.5px;color:#454A56}

/* record */
.rec{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:20px}
.rec-total{border-radius:var(--r-xl);background:var(--ink);color:var(--on-ink);padding:clamp(28px,3.4vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.rec-total::after{content:"";position:absolute;right:-30%;bottom:-40%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(47,75,255,.45),transparent 65%)}
.rec-total .num{font-size:clamp(64px,8vw,112px);position:relative;z-index:1}
.rec-total .lbl{display:block;margin-top:14px;color:var(--on-ink-m);font-size:15px;position:relative;z-index:1}
.rows{border-radius:var(--r-xl);background:var(--mist);padding:clamp(14px,2vw,22px) clamp(22px,3vw,36px)}
.rrow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;padding:18px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .nm{font-weight:700;font-size:16.5px;letter-spacing:-.03em}
.rrow .amt{font-family:var(--f-en);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px;text-align:right;white-space:nowrap}
.rrow .amt small{font-family:var(--f-ko);font-size:12px;color:var(--muted);margin-left:2px;font-weight:500}
.rrow .meta{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.rrow .rbar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--mist-2);overflow:hidden;margin-top:6px}
.rrow .rbar i{display:block;height:100%;border-radius:4px;background:var(--cobalt)}
.docs-lbl{display:block;font-family:var(--f-en);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:40px 0 16px}
.docs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.doc{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.doc img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.doc span{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.35}

/* cases */
.case-a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.cbox{position:relative;border-radius:var(--r-xl);background:var(--ink-2);padding:clamp(26px,3.4vw,44px);min-width:0}
.cbox .ctag{font-family:var(--f-mono);font-size:12px;color:var(--sky);letter-spacing:.06em}
.cbox h3{font-size:clamp(26px,2.8vw,38px);font-weight:800;letter-spacing:-.05em;margin-top:10px;line-height:1.2}
.cbox .desc{color:var(--on-ink-m);margin-top:14px;font-size:16px}
.cbox .note{color:var(--on-ink-m);font-size:13.5px;margin-top:22px;padding-top:18px;border-top:1px solid var(--ink-line)}

.tk-chips{margin-top:28px}

      }) + '</div>' + ADD('program.schedule') + E('program.note', 'p', 'note') + '</div></div></div></section>';
  }
  function vWhy() {

  function vProcess() {

      return '<li class="step"><span class="n">STEP ' + two(i) + '</span>' + E(p + '.en', 'span', 'sen') + E(p + '.name', 'h3') + E(p + '.desc', 'p') + DEL(l, i) + '</li>';
    }) + '</ol>' + ADD('process.steps') + '</div></section>';

  function vRecord() {
    var rows = get('record.rows') || [], val = function (r) { return parseFloat(String(r.amount).replace(/[^0-9.]/g, '')) || 0; };
    var max = Math.max.apply(null, rows.map(val).concat([1]));

      '<div class="rec-total"><span class="eyebrow" style="position:relative;z-index:1">TOTAL</span><div><span class="num">' + E('record.totalNum') + '<span class="unit">' + E('record.totalUnit') + '</span></span>' + E('record.totalLabel', 'span', 'lbl') + '</div></div>' +
      '<div class="rows">' + rows.map(function (r, i) {
        var p = 'record.rows.' + i;
        return '<div class="rrow">' + E(p + '.name', 'span', 'nm') + '<span class="amt">' + E(p + '.amount') + '<small>원</small></span>' +
          '<span class="meta">' + E(p + '.note') + ' · ' + E(p + '.org') + ' · ' + E(p + '.period') + '</span>' +
          '<span class="rbar"><i style="width:' + (val(r) / max * 100).toFixed(1) + '%"></i></span>' + DEL('record.rows', i) + '</div>';
      }).join('') + ADD('record.rows') + '</div></div>' +
      E('record.docsLabel', 'span', 'docs-lbl') + '<div class="docs">' + each('record.docs', function (p, it, i, l) { return '<figure class="doc">' + IMG(it.img, it.label + ' 협약서') + E(p + '.label') + DEL(l, i) + '</figure>'; }) + '</div>' + ADD('record.docs') +
      '</div></section>';

  function vCases() {
    var a = 'cases.a', b = 'cases.b';
    return '<section class="band ink" id="cases"><div class="wrap">' + head('cases', '', true) +
      '<div class="case-a"><div class="cbox">' + E(a + '.tag', 'span', 'ctag') + E(a + '.name', 'h3') + E(a + '.desc', 'p', 'desc') + E(a + '.note', 'p', 'note') + '</div>' +
      '<div class="cbox big599"><div><span class="num">' + E(a + '.bigNum') + '<span class="unit">' + E(a + '.bigUnit') + '</span></span>' + E(a + '.bigLabel', 'span', 'bl') + '</div>' +
      '<div class="cstats">' + each(a + '.stats', function (p, it, i, l) { return '<div class="cstat"><span class="num">' + E(p + '.num') + '<span class="unit">' + E(p + '.unit') + '</span></span>' + E(p + '.label', 'span', 'lbl') + DEL(l, i) + '</div>'; }) + '</div>' + ADD(a + '.stats') + '</div></div>' +
      '<div class="cbox"><div class="case-b-head"><div>' + E(b + '.tag', 'span', 'ctag') + E(b + '.name', 'h3') + '</div>' + E(b + '.desc', 'p', 'desc') + '</div>' +
      '<div class="clients">' + each(b + '.clients', function (p, it, i, l) {
        return '<div class="client">' + E(p + '.name', 'span', 'nm') + E(p + '.field', 'span', 'fd') + E(p + '.work', 'span', 'wk') + E(p + '.result', 'span', 'rs') + DEL(l, i) + '</div>';
      }) + '</div>' + ADD(b + '.clients') + '</div></div></section>';
  }
  function vAwards() {
    return '<section class="band mist"><div class="wrap">' + head('awards', '', true) + '<div class="aw-stats">' + each('awards.stats', function (p, it, i, l) {
      return '<div class="aw"><span class="num">' + E(p + '.num') + '<span class="unit">' + E(p + '.unit') + '</span></span>' + E(p + '.label', 'span', 'lbl') + DEL(l, i) + '</div>';
    }) + '</div>' + ADD('awards.stats') +
      '<div class="certs">' + each('awards.certs', function (p, it, i, l) {
        return '<figure class="cert"><div class="paperc">' + IMG(it.img, it.label) + '</div>' + E(p + '.date', 'span', 'date') + E(p + '.label', 'span', 'lbl') + DEL(l, i) + '</figure>';
      }) + '</div>' + ADD('awards.certs') + '</div></section>';
  }
  function vTalks() {
    var rows = get('talks.chart') || [], max = Math.max.apply(null, rows.map(function (r) { return parseFloat(r.v) || 0; }).concat([1]));
    return '<section class="band" id="talks"><div class="wrap">' + head('talks', '', true) + '<div class="tk-grid"><div class="tk-big"><span class="num">' + E('talks.num') + '<span class="unit">' + E('talks.unit') + '</span></span>' + E('talks.label', 'span', 'lbl') + E('talks.sub', 'span', 'sub') + '</div>' +
      '<figure class="chart"><figcaption>' + E('talks.chartCaption') + '</figcaption><div class="bars">' +
      rows.map(function (r, i) { var n = parseFloat(r.v) || 0; return '<div class="bar' + (n === max ? ' max' : '') + '">' + E('talks.chart.' + i + '.v', 'span', 'v') + '<i style="height:' + (n / max * 82).toFixed(1) + '%"></i></div>'; }).join('') +
      '</div><div class="bar-labels">' + each('talks.chart', function (p, it, i, l) { return '<span>' + E(p + '.m') + DEL(l, i) + '</span>'; }) + '</div>' + ADD('talks.chart') + '</figure></div>' +
      '<div class="chips tk-chips">' + each('talks.schools', function (p, it, i, l) { return '<span class="chip">' + E(p + '.label') + DEL(l, i) + '</span>'; }) + ADD('talks.schools') + '</div>' +
      '<div class="tk-list">' + each('talks.list', function (p, it, i, l) {
        return '<div class="tk"><div class="tk-row">' + E(p + '.date', 'span', 'date') + E(p + '.badge', 'span', 'badge') + '</div>' + E(p + '.title', 'b') + E(p + '.sub', 'span', 'sub') + DEL(l, i) + '</div>';
      }) + '</div>' + ADD('talks.list') + '</div></section>';
  }
  function vLogos() {
    var one = each('logos.items', function (p, it, i, l) { return '<div class="mlogo">' + IMG(it.img, '협업 기관 로고') + DEL(l, i) + '</div>'; });
    var dup = editing ? '' : (get('logos.items') || []).map(function (it) { return '<div class="mlogo dup" aria-hidden="true"><img src="' + (assets[it.img] || '') + '" alt=""></div>'; }).join('');
    return '<section class="marquee-band">' + E('logos.label', 'span', 'lbl') + '<div class="marquee"><div class="mtrack">' + one + dup + '</div></div><div class="wrap" style="text-align:center">' + ADD('logos.items') + '</div></section>';
  }
  function vLeader() {
    return '<section class="band" id="leader"><div class="wrap"><div class="ld"><div class="ld-card" style="background:var(--ink);color:var(--on-ink)"><p class="eyebrow" style="color:var(--sky)">' + E('leader.eyebrow') + '</p>' +
      '<div style="margin-top:10px">' + E('leader.title', 'h2', 'h2') + '</div>' + E('leader.intro', 'p', 'ld-intro" style="color:var(--on-ink-m)') + '</div>' +
      '<div class="ld-card"><dl class="prows">' + each('leader.rows', function (p, it, i, l) {
        return '<div class="prow"><dt>' + E(p + '.label') + '</dt><dd>' + E(p + '.main', 'span', 'main') + (it.sub || editing ? E(p + '.sub', 'span', 'sub') : '') + '</dd>' + DEL(l, i) + '</div>';
      }) + '</dl>' + ADD('leader.rows') + '</div></div>' +
      '<div class="timeline">' + each('leader.timeline', function (p, it, i, l) {
        return '<div class="tl">' + E(p + '.date', 'span', 'date') + E(p + '.org', 'span', 'org') + E(p + '.role', 'span', 'role') + DEL(l, i) + '</div>';
      }) + '</div>' + ADD('leader.timeline') + '</div></section>';
  }
  function vFaq() {
    return '<section class="band mist" id="faq"><div class="wrap faq-grid"><div>' + E('faq.title', 'h2', 'h2') + '</div><div>' + each('faq.items', function (p, it, i, l) {
      if (editing) return '<div class="qa edit">' + E(p + '.q', 'span', 'q') + E(p + '.a', 'p', 'ans') + DEL(l, i) + '</div>';
      return '<details class="qa"' + (i === 0 ? ' open' : '') + '><summary><span>' + esc(it.q) + '</span><span class="pm">' + PLUS + '</span></summary><p class="ans">' + esc(it.a) + '</p></details>';
    }) + ADD('faq.items') + '</div></div></section>';
  }
  function vContact() {
    return '<section class="band contact" id="contact"><div class="wrap ct-grid"><div><p class="eyebrow">' + E('contact.eyebrow') + '</p>' + E('contact.title', 'h2', 'h2') + E('contact.lead', 'p', 'lead') +
      '<div class="ct-topics">' + E('contact.topicsLabel', 'span', 't') + '<div class="chips" style="margin-top:12px">' + each('contact.topics', function (p, it, i, l) { return '<span class="chip">' + E(p + '.label') + DEL(l, i) + '</span>'; }) + ADD('contact.topics') + '</div></div></div>' +
      '<div>' + each('contact.items', function (p, it, i, l) {
        return '<div class="citem">' + E(p + '.label', 'span', 'lbl') + E(p + '.value', 'span', 'val') + '<button type="button" class="copy" data-copy="' + p + '.value">복사</button>' + DEL(l, i) + '</div>';
      }) + ADD('contact.items') + '</div></div></section>' +
      '<footer class="foot"><div class="wrap foot-in">' + logo() + E('contact.footer') + '<a href="#top">맨 위로 ↑</a></div></footer>';
  }
  function vEdit() {
    if (!artifact) return '';
    if (!editing) return '<button type="button" class="ed-fab" data-act="edit">✎ 편집</button>';
    return '<div class="ed-bar"><p id="ed-status">편집 중입니다. 글자를 눌러 고치고, 사진을 눌러 바꾼 뒤 저장하세요.</p><div class="acts"><button type="button" data-act="cancel">취소</button><button type="button" class="save" data-act="save">저장</button></div></div>' +
      '<input type="file" id="ed-file" accept="image/*" hidden>';
  }
  function render() {
    var y = window.scrollY;
    document.body.classList.toggle('editing', editing);
    app.innerHTML = vNav() + '<main>' + vHero() + vStatement() + vStats() + vLineup() + vProgram() + vWhy() + vProcess() + vRecord() + vCases() + vAwards() + vTalks() + vLogos() + vLeader() + vFaq() + '</main>' + vContact() + vEdit();
    window.scrollTo(0, y);
    onScroll();
  }
  function status(msg) { var el = $('#ed-status'); if (el) el.textContent = msg; }

  /* scroll effects: stage spread, statement word highlight, nav hairline */
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, ticking = false;
  function onScroll() {
    ticking = false;
    var vh = window.innerHeight, nav = $('.nav');
    if (nav) nav.classList.toggle('scrolled', window.scrollY > 8);
    if (reduce || editing) return;
    var st = $('#stage');
    if (st) { var r = st.getBoundingClientRect(); var p = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height * .4))); st.style.setProperty('--p', p.toFixed(3)); }
    var ws = app.querySelectorAll('.statement .w');
    if (ws.length) {
      var box = ws[0].parentNode.getBoundingClientRect();
      var prog = Math.min(1, Math.max(0, (vh * .78 - box.top) / (box.height + vh * .3)));
      var n = Math.round(prog * ws.length);
      for (var i = 0; i < ws.length; i++) ws[i].classList.toggle('on', i < n);
    }
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  window.addEventListener('resize', onScroll);

  function blank(o) {
    var c = {};
    Object.keys(o).forEach(function (k) {
      if (k === 'img') { var nk = 'u' + Date.now() + (uid++); assets[nk] = assets[o[k]]; c[k] = nk; }
      else if (Array.isArray(o[k])) c[k] = o[k].map(blank);
      else if (k === 'to' || k === 'icon' || k === 'tone' || k === 'day') c[k] = o[k];
      else c[k] = '내용 입력';
    });
    return c;
  }
  function buildDoc() {
    var reset = ($('head style') || {}).textContent || '';
    if (reset.indexOf('safe-area-inset') < 0) reset = ':root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    var J = function (o) { return JSON.stringify(o).replace(/</g, '\\u003c'); };
    var used = {}; JSON.stringify(state).replace(/"img":"([^"]+)"/g, function (m, k) { used[k] = 1; });
    var keep = {}; Object.keys(assets).forEach(function (k) { if (used[k] || FIXED.test(k)) keep[k] = assets[k]; });
    var open = '<script', close = '<\/script>';
    return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>동행벤처스</title><meta name="description" content="사업 진단·성장 전략부터 정부지원사업, 투자 유치, 공공 제안, 창업교육까지. 직접 창업해 본 팀이 기업의 다음 단계를 설계하고 끝까지 실행합니다."><meta property="og:title" content="동행벤처스 | Startup Growth Consulting"><meta property="og:description" content="전략부터 실행까지, 성장을 함께 설계합니다."><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><style>' + reset + '</style></head><body>' +
      '<title>' + esc(document.title) + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link id="fontlink" rel="stylesheet" href="' + esc($('#fontlink').getAttribute('href')) + '">\n' +
      '<style id="css">' + $('#css').textContent + '</style>\n<div id="app"></div>\n' +
      open + ' type="application/json" id="assets">' + J(keep) + close + '\n' +
      open + ' type="application/json" id="content">' + J(state) + close + '\n' +
      open + ' id="main">' + $('#main').textContent + close + '</body></html>';
  }
  function save() {
    if (busy) return; busy = true;
    var html = buildDoc();
    if (html.length > 15 * 1024 * 1024) { busy = false; status('사진 용량이 너무 커서 저장할 수 없습니다. 더 작은 사진으로 바꿔 주세요.'); return; }
    status('저장하는 중입니다…');
    artifact.publish(html).then(function () { status('저장했습니다. 새 버전으로 다시 불러옵니다.'); }).catch(function (e) {
      busy = false; var c = e && e.code;
      if (c === 'conflict') status('다른 곳에서 먼저 수정되어 최신 버전으로 다시 불러옵니다.');
      else if (c === 'too_large') status('사진 용량이 커서 저장하지 못했습니다. 더 작은 사진으로 바꿔 주세요.');
      else if (c === 'rate_limited') status('저장이 너무 잦습니다. 잠시 후 다시 눌러 주세요.');
      else if (c === 'upstream_error' || !c) status('저장하지 못했습니다. 잠시 후 저장을 다시 눌러 주세요.');
      else status('이 화면에서는 저장할 수 없습니다. 편집 권한이 있는 계정으로 열어 주세요.');
    });
  }
  function pickImage(file) {
    var key = pendingImg; pendingImg = null; if (!file || !key) return;
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        var png = /png|webp|gif/.test(file.type), maxW = png ? 900 : 1400, w = Math.min(maxW, im.naturalWidth), h = Math.round(im.naturalHeight * w / im.naturalWidth);
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h);
        assets[key] = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82);
        render(); status('사진을 바꿨습니다. 저장을 눌러야 반영됩니다.');
      };
      im.onerror = function () { status('이 파일은 사진으로 열 수 없습니다. JPG나 PNG 파일을 골라 주세요.'); };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  app.addEventListener('input', function (e) {
    var el = e.target.closest && e.target.closest('[data-k]');
    if (editing && el) set(el.getAttribute('data-k'), el.innerText.replace(/\n$/, ''));
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'ed-file') pickImage(t.files[0]);
    else if (t.hasAttribute('data-tone')) { set(t.getAttribute('data-tone') + '.tone', t.value); render(); }
    else if (t.hasAttribute('data-icon')) { set(t.getAttribute('data-icon') + '.icon', t.value); render(); }
  });
  app.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-act]'))) {
      var act = b.getAttribute('data-act');
      if (act === 'nav') { navOpen = !navOpen; render(); }
      else if (act === 'edit') { editing = true; navOpen = false; render(); }
      else if (act === 'cancel') { state = JSON.parse(savedState); assets = JSON.parse(savedAssets); editing = false; render(); }
      else if (act === 'save') save();
      else if (act === 'prev' || act === 'next') {
        var rail = $('#rail'), card = rail && rail.querySelector('.prod');
        if (rail && card) rail.scrollBy({ left: (act === 'next' ? 1 : -1) * (card.offsetWidth + 20), behavior: reduce ? 'auto' : 'smooth' });
      }
      return;
    }
    if ((b = t.closest('[data-copy]'))) {
      var val = get(b.getAttribute('data-copy')), done = function () { b.textContent = '복사됨'; setTimeout(function () { b.textContent = '복사'; }, 1600); };
      var sel = function () { var r = document.createRange(); r.selectNodeContents(b.previousElementSibling); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '선택됨'; };
      try { navigator.clipboard.writeText(val).then(done, sel); } catch (err) { sel(); }
      return;
    }
    if (editing) {
      if ((b = t.closest('[data-del]'))) { e.preventDefault(); get(b.getAttribute('data-del')).splice(+b.getAttribute('data-i'), 1); render(); return; }
      if ((b = t.closest('[data-add]'))) { var arr = get(b.getAttribute('data-add')); if (arr.length) { arr.push(blank(arr[arr.length - 1])); render(); } return; }
      if ((b = t.closest('[data-img]'))) { e.preventDefault(); pendingImg = b.getAttribute('data-img'); var f = $('#ed-file'); f.value = ''; f.click(); return; }
      if (t.closest('a') && !t.closest('select')) e.preventDefault();
      return;
    }
    if (t.closest('.nav-links a') && navOpen) { navOpen = false; $('.nav').classList.remove('open'); }
  });

  render();
  if (window.claude && typeof window.claude.use === 'function') {
    Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function (r) {
      if (!r[0] || !r[1]) return;
      return r[1].canEdit().then(function (ok) { if (ok) { artifact = r[0]; render(); } });
    }).catch(function () {});
  }
})();
</script></body></html>
